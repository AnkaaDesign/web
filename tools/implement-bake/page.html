<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#202124}canvas{display:block}</style>

</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2d31);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.8); fill.position.set(-6, 4, -4); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const camera = new THREE.PerspectiveCamera(28, W / H, 0.05, 500);

function palette(i) {
  const golden = 0.61803398875;
  const h = (i * golden) % 1;
  return new THREE.Color().setHSL(h, 0.72, 0.55);
}

function matGroupOf(mesh) {
  // FBX2glTF: mesh/node name `${owner}_${material}_${n}`
  let nm = (mesh.name || '').replace(/_\d+$/, '');
  const cands = [];
  for (let o = mesh; o; o = o.parent) if (o.name && nm.startsWith(o.name + '_')) cands.push(o.name);
  cands.sort((a, b) => b.length - a.length);
  if (cands.length) return nm.slice(cands[0].length + 1);
  const m = nm.match(/^.*_([^_]+)$/); return m ? m[1] : (mesh.material?.name || nm);
}

window.__shoot = async function (url, mode) {
  const loader = new GLTFLoader();
  const draco = new DRACOLoader(); draco.setDecoderPath('/vendor/draco/');
  loader.setDRACOLoader(draco);
  const gltf = await loader.loadAsync(url);
  const root = gltf.scene;
  scene.add(root);

  /* Num arquivo JÁ materializado o material é a verdade; o nome da malha só
     serve para o `.gltf` cru, em que todos apontam para o mesmo material. */
  const materialized = (gltf.parser?.json?.materials || []).length > 1;
  const groups = new Map();
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = materialized ? (o.material?.name || '(sem nome)') : matGroupOf(o);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(o);
  });
  const names = [...groups.keys()].sort();

  if (mode === 'color') {
    names.forEach((n, i) => {
      const c = palette(i);
      const m = new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0.0, side: THREE.DoubleSide });
      groups.get(n).forEach(o => { o.material = m; });
    });
  } else {
    root.traverse(o => { if (o.isMesh && o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => { if ('envMapIntensity' in m) m.envMapIntensity = 1.2; });
    }});
  }

  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const ctr = box.getCenter(new THREE.Vector3());
  const radius = size.length() / 2;

  const views = {
    'fr34':  [ 1.05, 0.42,  0.85],   // frente-direita
    'rr34':  [-0.95, 0.40, -0.90],   // traseira-esquerda
    'side':  [ 1.6,  0.10,  0.0 ],
    'rear':  [ 0.0,  0.12, -1.7 ],
    'top':   [ 0.35, 1.5,   0.35],
  };
  const shots = {};
  for (const [k, dir] of Object.entries(views)) {
    const d = new THREE.Vector3(...dir).normalize();
    const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.62;
    camera.position.copy(ctr).addScaledVector(d, dist);
    camera.lookAt(ctr); camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    shots[k] = renderer.domElement.toDataURL('image/png');
  }
  return { shots, groups: names.map(n => ({ name: n, meshes: groups.get(n).length })), bbox: { min: box.min.toArray(), max: box.max.toArray() } };
};
window.__ready = true;
</script></body></html>
