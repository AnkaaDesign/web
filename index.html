<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!--
      Warm the socket to the API before any module runs.

      %VITE_API_URL% is substituted by the html-env-replace plugin in
      vite.config.ts (same token the bootstrap script below reads), so this is a
      build-time value, not a runtime one.

      Why it earns its place: the API now also serves the Truck Studio asset
      tree (~300 MB of geometry/HDRI/PBR maps) under /studio-assets/. The very
      first thing the studio does is fetch environments.json + brands.json +
      cabs.json, and those three block the whole scene. Without this the user
      pays DNS + TCP + TLS on the critical path. It is also the first request of
      every session for the REST API itself, so the hint is never wasted.

      Two links on purpose: `crossorigin` opens a CORS-mode connection (what
      axios and three.js — which sets crossOrigin="anonymous" by default — will
      actually use), while dns-prefetch covers the plain-mode case in browsers
      that keep the two pools separate. When the base is same-origin (the dev
      proxy, or nginx in production) both are simply no-ops.
    -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_API_URL%" />

    <!-- App Icons and Manifest -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Viewport and App Configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#22c55e" />
    <meta name="description" content="Ankaa - Sistema de Gestão Industrial Brasileiro" />
    <meta name="keywords" content="gestão, industrial, manufatura, brasil, ankaa" />
    <meta name="author" content="Ankaa Systems" />

    <!--
      Open Graph — o cartão que WhatsApp, e-mail e redes montam a partir de um
      link nosso.

      QUEM DE FATO VÊ ISTO É O CLIENTE, não a equipe. Os únicos links da Ankaa
      que circulam para fora são os da assinatura eletrônica (/cliente/assinar)
      e o da verificação pública de documento (/v/CODIGO). O sistema interno
      ninguém compartilha por link — então o texto aqui descreve o que o
      destinatário externo está prestes a abrir, e não o ERP.

      DUAS CORREÇÕES QUE ERAM DEFEITO, NÃO GOSTO:

      1. `og:image` era RELATIVA (`/icons/...`). Open Graph exige URL absoluta;
         parte dos consumidores simplesmente descarta a imagem, e o cartão sai
         sem miniatura — que é metade do sinal de que o link é legítimo.
      2. Não havia `og:url`. Sem ela o consumidor usa a URL crua, e a de
         assinatura carrega um token opaco de 43 caracteres: o cartão exibia
         aquilo como endereço, o que é exatamente a cara de um link de phishing.
         Com `og:url` o cartão mostra o domínio.

      A prévia do WhatsApp NÃO depende mais destas tags — o servidor monta o
      cartão explicitamente (ver `WhatsAppLinkPreview` na api), justamente porque
      esta é uma SPA e o nginx devolve o MESMO index.html para toda rota. Estas
      tags continuam valendo para todo o resto, e para o caso de a montagem
      explícita falhar.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ankaadesign.com.br" />
    <meta property="og:title" content="Ankaa Design" />
    <meta
      property="og:description"
      content="Documentos e assinatura eletrônica da Ankaa Design — orçamentos para revisão, assinatura e verificação de autenticidade."
    />
    <meta property="og:image" content="https://ankaadesign.com.br/icons/android-chrome-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Ankaa Design" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Ankaa Design" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ankaa Design" />
    <meta
      name="twitter:description"
      content="Documentos e assinatura eletrônica da Ankaa Design."
    />
    <meta name="twitter:image" content="https://ankaadesign.com.br/icons/android-chrome-512x512.png" />

    <!-- Prevent browser translation and password saving for security -->
    <meta name="google" content="notranslate" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Inter font is now self-hosted via @fontsource-variable/inter for offline support -->

    <!-- Set API URL BEFORE any modules load to prevent QueryClient initialization errors -->
    <script>
      (function() {
        var h = window.location.hostname;
        var pagePort = window.location.port;
        var envUrl = "%VITE_API_URL%";
        var isLan = h.indexOf("192.168.") === 0 || h.indexOf("10.") === 0 || /^172\.(1[6-9]|2\d|3[01])\./.test(h);
        if (isLan) {
          // Dev (Vite dev server on a non-80 port, e.g. :5173): hit the API
          // directly on the SAME host the page loaded from, on the API port.
          // This lets phones/tablets on the LAN reach the API at the same IP
          // they used for the page — no nginx required.
          // Production (served by nginx on :80): route through the /api proxy
          // (/api/* → :3030 internally), since direct :3030 is firewalled there.
          if (pagePort && pagePort !== "80") {
            var m = /:(\d+)/.exec(envUrl);
            var apiPort = m ? m[1] : "3030";
            window.__ANKAA_API_URL__ = "http://" + h + ":" + apiPort;
          } else {
            window.__ANKAA_API_URL__ = "http://" + h + "/api";
          }
        } else {
          // Localhost or production domain: use the env var
          window.__ANKAA_API_URL__ = envUrl;
        }
      })();
    </script>

    <title>Ankaa Design</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
