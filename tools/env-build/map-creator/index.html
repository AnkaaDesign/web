<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Truck Studio — Map Creator</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c2027; --line:#2c313b; --ink:#e6e9ef; --dim:#8b93a3;
    --accent:#5aa9e6; --ok:#4fbf7b; --warn:#e0a32e; --bad:#e2564a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif;overflow:hidden}
  #app{display:grid;grid-template-columns:1fr 280px;grid-template-rows:44px 1fr;height:100%}
  header{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:13px;font-weight:600;margin:0 12px 0 0;letter-spacing:.02em}
  button,select{background:#252a33;color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:#3d4estimate}
  button:hover{background:#2e343f}
  button.on{background:var(--accent);border-color:var(--accent);color:#08121b;font-weight:600}
  .grow{flex:1}
  .stat{color:var(--dim);font-variant-numeric:tabular-nums}
  #stage{position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #three{position:absolute;inset:0;display:none}
  aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:10px}
  aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    margin:14px 0 6px}
  aside h2:first-child{margin-top:0}
  .row{display:flex;align-items:center;gap:6px;margin:4px 0}
  .row label{width:52px;color:var(--dim)}
  .row input{flex:1;background:#12151a;border:1px solid var(--line);border-radius:5px;
    color:var(--ink);padding:4px 6px;font:inherit;min-width:0}
  .issue{border-left:3px solid var(--bad);padding:4px 8px;margin:4px 0;background:#241a19;
    border-radius:0 5px 5px 0;cursor:pointer}
  .issue.warn{border-color:var(--warn);background:#241f16}
  .issue b{display:block;font-weight:600}
  .issue span{color:var(--dim)}
  .hint{color:var(--dim);font-size:12px}
  kbd{background:#12151a;border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    font:11px ui-monospace,monospace}
  #err{position:absolute;inset:0;display:none;place-content:center;text-align:center;
    padding:40px;background:var(--bg)}
  #err code{display:block;margin:12px auto;background:#0e1014;border:1px solid var(--line);
    border-radius:6px;padding:10px 14px;max-width:640px;color:var(--accent);
    font:12px ui-monospace,monospace;user-select:all}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Map Creator</h1>
    <button id="m2d" class="on">2D — editar</button>
    <button id="m3d">3D — ver</button>
    <select id="add"><option value="">+ adicionar…</option></select>
    <button id="dup">Duplicar</button>
    <button id="del">Apagar</button>
    <span class="grow"></span>
    <span class="stat" id="stats"></span>
    <button id="load">Abrir</button>
    <button id="save">Salvar JSON</button>
  </header>
  <div id="stage">
    <canvas id="plan"></canvas>
    <canvas id="three"></canvas>
    <div id="err"></div>
  </div>
  <aside>
    <h2>Peça</h2>
    <div id="sel" class="hint">Nada selecionado.</div>
    <h2>Auditoria</h2>
    <div id="audit"></div>
    <h2>Atalhos</h2>
    <div class="hint">
      <kbd>arrastar</kbd> mover · <kbd>R</kbd> girar 90° ·
      <kbd>[</kbd><kbd>]</kbd> escala · <kbd>Ctrl+D</kbd> duplicar ·
      <kbd>Del</kbd> apagar · <kbd>setas</kbd> 0,5 m ·
      <kbd>Shift+setas</kbd> 5 m · <kbd>roda</kbd> zoom ·
      <kbd>botão do meio</kbd> pan
    </div>
  </aside>
</div>
<input type="file" id="file" accept="application/json" hidden>
<!-- Os modulos de three/examples/jsm importam o especificador NU 'three', que o
     navegador nao resolve sozinho — sem este mapa o GLTFLoader tenta buscar
     "/three", leva 404, e o boot morre em silencio com a pagina em branco.
     BufferGeometryUtils tambem e pedido por caminho relativo de fora de vendor/. -->
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/",
    "../utils/BufferGeometryUtils.js": "./vendor/BufferGeometryUtils.js"
} }
</script>
<script type="module" src="./editor.js"></script>
</body>
</html>
