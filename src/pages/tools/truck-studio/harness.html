<!doctype html>
<!--
  Truck Studio dev harness — mounts the engine on a bare page, with no Ankaa
  around it. Open it in the dev server:

      pnpm dev  →  http://localhost:5173/src/pages/tools/truck-studio/harness.html

  Useful for working on the engine without the app's auth, routing or layout in
  the way, and for driving it from a headless browser: `window.__harnessReady`
  flips true once mountStudio() resolves, and `window.__harnessError` carries the
  message if boot failed. The console handle `window.__studio` is the same one
  the real page installs.

  This lived at the repo root as __studio-harness.html after the port, referenced
  by nothing and with every path stale. It is co-located with the engine now so
  the two move together.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Truck Studio harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1017; }
      #host { height: 100vh; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <!-- ?pump=1 — drive the frame loop without a visible tab.
         Chrome stops requestAnimationFrame entirely in a background tab and
         throttles setTimeout to about one call a minute, so an automated
         browser whose pane is hidden never gets past boot: mountStudio() waits
         on a frame that will not come, and the loader sits on "Carregando
         catálogo…" forever. That is not a studio bug and there is nothing to
         fix in the engine — it is the page being invisible.
         MessageChannel is the way out: its messages are tasks, not timers, so
         they are not throttled with the tab in the background. Swapping rAF for
         a channel round-trip gives the engine a real (if unpaced) frame loop.
         OPT-IN, and only ever on this page: the studio itself must keep the
         browser's rAF, which is what keeps it synced to the display and idle
         when nobody is looking. -->
    <script>
      if (new URLSearchParams(location.search).has('pump')) {
        window.requestAnimationFrame = function (cb) {
          var ch = new MessageChannel();
          ch.port1.onmessage = function () { cb(performance.now()); };
          ch.port2.postMessage(0);
          return 0;
        };
        window.cancelAnimationFrame = function () {};
        console.log('[harness] rAF pumped via MessageChannel (?pump=1)');
      }
    </script>
    <!-- real file, not an inline script: vite's html-proxy for inline modules
         breaks when the app's service worker serves this page from cache -->
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
